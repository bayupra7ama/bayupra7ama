name: Portfolio CI

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "tsconfig.json"
      - "next.config.mjs"
      - ".github/workflows/portfolio-ci.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static portfolio
        run: npm run build
